server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a path only. Behind `tailscale serve` (HTTPS on 443 in front of this
    # container's port 80) an absolute redirect would point at http://host:80/ and break.
    absolute_redirect off;

    # The mobile view is its own page at /m/ — see m/index.html
    location = /m {
        return 301 /m/;
    }
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend container
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy /thumbor to the Thumbor image processing service
    location /thumbor/ {
        proxy_pass http://thumbor:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy /admin to the backend (admin dashboard)
    location /admin {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
